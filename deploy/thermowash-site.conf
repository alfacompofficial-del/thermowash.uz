# Mavjud Nginx konteyneriga qo'shiladigan server blok.
# DOMAIN ni o'zingiznikiga almashtiring (masalan thermowash.thermowash.uz).

server {
    listen 80;
    listen [::]:80;
    server_name thermowash.thermowash.uz;

    # Certbot (webroot usuli) uchun
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://thermowash.thermowash.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thermowash.thermowash.uz;

    ssl_certificate     /etc/letsencrypt/live/thermowash.thermowash.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thermowash.thermowash.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Ariza endpointiga qo'shimcha limit.
    # limit_req_zone ni nginx.conf ning http{} blokiga qo'shing:
    #   limit_req_zone $binary_remote_addr zone=thermowash_lead:10m rate=6r/m;
    location = /api/lead {
        limit_req zone=thermowash_lead burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://thermowash:3000;
        include /etc/nginx/conf.d/thermowash-proxy.inc;
    }

    location /_next/static/ {
        proxy_pass http://thermowash:3000;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://thermowash:3000;
        include /etc/nginx/conf.d/thermowash-proxy.inc;
    }
}
