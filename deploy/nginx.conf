# /etc/nginx/sites-available/thermowash
# "thermowash.uz" ni o'z domeningizga almashtiring.

# Ariza endpointi uchun qo'shimcha rate limit (IP bo'yicha)
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=6r/m;

upstream kotyol_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP -> HTTPS va www -> asosiy domen
server {
    listen 80;
    listen [::]:80;
    server_name thermowash.uz www.thermowash.uz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://thermowash.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.thermowash.uz;
    ssl_certificate     /etc/letsencrypt/live/thermowash.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thermowash.uz/privkey.pem;
    return 301 https://thermowash.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thermowash.uz;

    ssl_certificate     /etc/letsencrypt/live/thermowash.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thermowash.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # Next.js statik fayllari — uzoq kesh
    location /_next/static/ {
        proxy_pass http://kotyol_app;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/lead {
        limit_req zone=lead_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://kotyol_app;
        include /etc/nginx/snippets/kotyol-proxy.conf;
    }

    location / {
        proxy_pass http://kotyol_app;
        include /etc/nginx/snippets/kotyol-proxy.conf;
    }
}
